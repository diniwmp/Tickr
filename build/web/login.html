<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Tickr Admin Pro | login</title>
        <link rel="stylesheet" href="assets/admin/vendors/mdi/css/materialdesignicons.min.css">
        <link rel="stylesheet" href="assets/admin/vendors/css/vendor.bundle.base.css">

    <body>
        <div class="container-scroller">

                <div class="content-wrapper d-flex align-items-center auth px-0">
                    <div class="row w-100 mx-0">
                        <div class="col-lg-4 mx-auto">
                            <div class="auth-form-light text-left py-5 px-4 px-sm-5">
                                <div class="brand-logo">
                                    <img src="assets/images/logo.png" alt="logo">
                                </div>

                                <h6 class="font-weight-light">Sign in to continue.</h6>

                                <p class="mb-3 text-danger ml-3 text-center" id="message"> </p>
                                
                                
                                <form class="pt-3">
                                    <div class="form-group">
                                        <input type="email" class="form-control form-control-lg" id="adminemail" placeholder="Email Address">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control form-control-lg" id="adminpassword" placeholder="Password">
                                    </div>
                                    <div class="mt-3 d-grid gap-2">
                                        <a class="vs-btn mask-style1 w-100 style4" href="#" onclick="adminSignIn();">SIGN IN</a>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- content-wrapper ends -->
            </div>
            <!-- page-body-wrapper ends -->
