    <body onload="invoiceLoad();" >

        <div id="invoice-content">
            <div class="col-auto  justify-content-center text-center">
                <div class="vs-logo">
                    <a href="index.html"><img src="assets/img/logo.png" alt="logo"></a>
                </div>
            </div>

            <h2 class="h1 justify-content-center text-center">Invoice</h2>

            <section class="vs-checkout-wrapper ">
                <div class="container">

                    <form action="#" class="woocommerce-checkout">
                        <div class="row ">
                            <div class="col-lg-6">
                                <div>
                                    <!--<h2 class="h4 center">Invoice</h2>-->
                                </div>
                                <br/>
                                <div class="row" >

                                    <span class="amount"  id="name"> full name</span>
                                    <span class="amount"  id="email"> Email</span>
                                    <span class="amount"  id="phone"> Mobile</span>
                                    <span class="amount"  id="addressUL">address</span>

                                </div>
                            </div>
                        </div>
                    </form>
                    <!--==============================-->
                    <h4 class="mt-4 pt-lg-2">Your Order</h4>
                    <form action="#" class="woocommerce-cart-form">
                        <div class="table-responsive">
                            <table class="cart_table">
                                <thead>
                                    <tr>
                                        <th class="cart-col-image">Image</th>
                                        <th class="cart-col-productname">Product Name</th>
                                        <th class="cart-col-price">Price</th>
                                        <th class="cart-col-quantity">Quantity</th>
                                        <th class="cart-col-total">Total</th>
                                    </tr>
                                </thead>
                                <tbody id="st-tbody">
                                    <tr class="cart_item" id="st-item-tr">
                                        <td data-title="Product">
                                            <a class="cart-productimage" href="#" id="product-a1"><img width="91" height="91" id="product-image" alt="Image"></a>
                                        </td>
                                        <td data-title="Name">
                                            <a class="cart-productname" href="#" id="st-product-title">  Watch Name</a>
                                        </td>
                                        <td data-title="Price">
                                            <span class="amount">Rs.<span id="st-product-price">0.00</span></span>
                                        </td>
                                        <td data-title="Quantity">
                                            <strong class="product-quantity" id="st-product-qty">0</strong>
                                        </td>
                                        <td data-title="Total">
                                            <span class="amount">Rs.<span id="st-product-total-amount"></span></span>
                                        </td>
                                    </tr>
                                </tbody>

                            </table>
                        </div>
                    </form>

                    <div>

                        <div class="row justify-content-end">
                            <div class="col-md-5 col-lg-6 col-xl-6">
                                <h2 class="h4 summary-title"></h2>
                                <table class="cart_totals">
                                    <tbody>
                                        <tr class="cart-subtotal"  id="st-subtotal-tr">
                                            <td>Order Subtotal</td>
                                            <td data-title="Cart Subtotal">
                                                <span class="amount">Rs.<span id="st-product-total"></span></span>
                                            </td>
                                        </tr>
                                    </tbody>
                                     <tbody>
                                        <tr class="cart-subtotal"  id="st-order-shipping-tr">
                                            <td>Shipping Cost </td>
                                            <td data-title="Cart Subtotal">
                                                <span class="amount">Rs.<span id="st-product-total"></span></span>
                                            </td>
                                        </tr>
                                    </tbody>
                                     <tbody>
                                        <tr class="cart-subtotal"  id="st-oder-total-tr">
                                            <td>Order Total</td>
                                            <td data-title="Cart Subtotal">
                                                <span class="amount">Rs.<span id="st-order-total-amount"></span></span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
            </section>

        </div>

        <div class="mt-lg-3 text-center space">
            <div class="form-row place-order pt-lg-2 d-flex justify-content-center">
                <button type="button" class="vs-btn style4" onclick="downInvoice();">Download Invoice</button>
            </div>
        </div>
